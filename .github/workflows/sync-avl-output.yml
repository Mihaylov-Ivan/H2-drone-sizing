name: One-shot AVL output sync

on:
  push:
    branches:
      - sync/avl-derivative-output

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/avl-derivative-output
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build pinned AVL
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libx11-dev
          git clone https://github.com/RobotLocomotion/avl.git /tmp/avl
          git -C /tmp/avl checkout b67837fa737afdf7a56655b044242619246b3ada
          cmake -S /tmp/avl -B /tmp/avl/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build /tmp/avl/build -j2
          cmake --install /tmp/avl/build
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Regenerate latest model output
        run: python run_model.py --config config/user_inputs.json --output /tmp/h2air-latest --no-histories
      - name: Commit generated latest output
        run: |
          rm -rf outputs/latest
          mkdir -p outputs/latest
          cp -a /tmp/h2air-latest/. outputs/latest/
          rm -f .github/workflows/sync-avl-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/latest .github/workflows/sync-avl-output.yml
          git commit -m "Regenerate latest output with automated AVL derivatives [skip ci]"
          git push origin HEAD:sync/avl-derivative-output
