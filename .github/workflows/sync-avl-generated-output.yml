name: Sync AVL generated output

on:
  push:
    branches:
      - sync/avl-generated-output

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync generated AVL outputs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/avl-generated-output
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build pinned AVL
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libx11-dev
          git clone https://github.com/RobotLocomotion/avl.git /tmp/avl
          git -C /tmp/avl checkout b67837fa737afdf7a56655b044242619246b3ada
          cmake -S /tmp/avl -B /tmp/avl/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build /tmp/avl/build -j2
          cmake --install /tmp/avl/build
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Regenerate outputs/latest
        run: python run_model.py --config config/user_inputs.json --output outputs/latest --no-histories
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/latest
          if git diff --cached --quiet; then
            echo "No generated output changes."
            exit 0
          fi
          git commit -m "Sync generated AVL outputs"
          git push origin HEAD:sync/avl-generated-output
