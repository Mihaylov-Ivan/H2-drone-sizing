name: One-shot tail planform output sync

on:
  push:
    branches:
      - sync/auto-tail-planform-output

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/auto-tail-planform-output
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate latest model output
        run: python run_model.py --config config/user_inputs.json --output /tmp/h2air-latest --no-histories
      - name: Commit generated latest output
        run: |
          rm -rf outputs/latest
          mkdir -p outputs/latest
          cp -a /tmp/h2air-latest/. outputs/latest/
          rm -f .github/workflows/sync-auto-tail-planform-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/latest .github/workflows/sync-auto-tail-planform-output.yml
          git commit -m "Regenerate latest output with tail planform autosizing [skip ci]"
          git push origin HEAD:sync/auto-tail-planform-output
